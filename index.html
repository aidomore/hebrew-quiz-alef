        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e1b4b 100%);
            overflow-x: hidden;
        }
        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
        }
        .particle {
            position: absolute;
            pointer-events: none;
            animation: burst 0.8s ease-out forwards;
            font-size: 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl w-full max-w-lg p-6 md:p-8 text-gray-800 relative overflow-hidden">
        
        <!-- Главное меню -->
        <div id="start-screen" class="text-center py-4">

            <div class="space-y-3">

                    🇮🇱 Иврит ➡️ Русский 🇷🇺

                <button onclick="startQuiz('ru-he')" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-lg py-3.5 rounded-2xl shadow-lg hover:opacity-90 transition transform active:scale-95 cursor-pointer">
                    🇷🇺 Русский ➡️ Иврит 🇮🇱
                </button>
            </div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="hidden relative">
            <div class="flex justify-between items-center mb-6">
                <span id="score" class="font-bold text-blue-600 text-lg">Счет: 0</span>
                <span id="question-progress" class="text-sm font-semibold text-gray-500">Вопрос 1 из 10</span>
                <button onclick="backToMenu()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer">
                    🏠 Меню
                </button>
            </div>

            <!-- Таймер 15 секунд -->
            <div class="w-full bg-gray-200 h-2.5 rounded-full mb-8 overflow-hidden">
                <div id="timer-bar" class="bg-blue-500 h-full transition-all duration-1000 linear w-full"></div>
            </div>

            <!-- Слово для перевода -->
            <div class="text-center mb-8 relative">
                <p id="prompt-label" class="text-xs uppercase tracking-widest text-blue-500 font-bold mb-2">Переведи слово:</p>
                <div id="target-word" class="text-3xl md:text-4xl font-extrabold text-gray-800 tracking-wide drop-shadow-sm" dir="rtl">
                    שָׁלוֹם
                </div>
            </div>

            <!-- Варианты ответов -->
            <div id="options-container" class="grid grid-cols-2 gap-3 relative">
                <!-- Кнопки ответов -->
            </div>
        </div>

        <!-- Экран результатов раунда -->
        <div id="result-screen" class="hidden text-center py-6">
            <div class="text-6xl mb-4" id="result-emoji">🏆</div>

                В главное меню 🏠
            </button>
        </div>

            { he: "מִסְפָּר", ru: "номер / число" },
            { he: "חֹם", ru: "жара / температура" },
            { he: "מֶזֶג אֲוִיר", ru: "погода" },
            { he: "שֶׁמֶשׁ", ru: "солнце" },
            { he: "גֶּשֶׁם", ru: "дождь" },
            { he: "יָם", ru: "море" },
            { he: "חוֹפֶשׁ", ru: "отпуск / свобода" },
            { he: "בְּרִיאוּת", ru: "здоровье" },
            { he: "מַזָּל", ru: "удача" },
            { he: "יְצִיאָה", ru: "выход" },
            { he: "כְּנִיסָה", ru: "вход" },
            { he: "פָּתוּחַ", ru: "открыто" },
            { he: "סָגוּר", ru: "закрыто" }
        ];

        document.getElementById('total-words').textContent = wordsDatabase.length;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const targetWordEl = document.getElementById('target-word');
        const promptLabelEl = document.getElementById('prompt-label');
        const optionsContainer = document.getElementById('options-container');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('question-progress');
        const timerBar = document.getElementById('timer-bar');
        const finalScoreText = document.getElementById('final-score-text');
        const resultEmoji = document.getElementById('result-emoji');

        let currentMode = 'he-ru'; // 'he-ru' или 'ru-he'
        let sessionQueue = [];     // Очередь вопросов на текущую сессию
        let mistakeQueue = [];     // Ошибочные слова для повторения в конце
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let timerInterval = null;
        let timeLeft = 15;

        function startQuiz(mode) {
            currentMode = mode;
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            score = 0;
            currentIndex = 0;
            mistakeQueue = [];
            
            // Берем 10 случайных слов для раунда
            sessionQueue = [...wordsDatabase].sort(() => 0.5 - Math.random()).slice(0, 10);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= sessionQueue.length) {
                // Если сессия закончилась, но есть ошибки — добавляем их в очередь на повтор
                if (mistakeQueue.length > 0) {
                    sessionQueue = [...mistakeQueue];
                    mistakeQueue = [];
                    currentIndex = 0;
                } else {
                    endGame();
                    return;
                }
            }

            isAnswered = false;
            startTimer();

            const currentPair = sessionQueue[currentIndex];
            progressEl.textContent = `Вопрос ${currentIndex + 1} из ${sessionQueue.length}`;
            scoreEl.textContent = `Счет: ${score}`;

            let displayedText = "";
            let correctAns = "";

            if (currentMode === 'he-ru') {
                promptLabelEl.textContent = "Переведи на русский:";
                displayedText = currentPair.he;
                targetWordEl.setAttribute('dir', 'rtl');
                correctAns = currentPair.ru;
            } else {
                promptLabelEl.textContent = "Переведи на иврит:";
                displayedText = currentPair.ru;
                targetWordEl.setAttribute('dir', 'ltr');
                correctAns = currentPair.he;
            }
            targetWordEl.textContent = displayedText;

            // Генерируем варианты ответов (1 правильный + 3 случайных)
            let options = [correctAns];
            while (options.length < 4) {
                let randomPair = wordsDatabase[Math.floor(Math.random() * wordsDatabase.length)];
                let randomOpt = (currentMode === 'he-ru') ? randomPair.ru : randomPair.he;
                if (!options.includes(randomOpt)) {
                    options.push(randomOpt);
                }
            }
            options.sort(() => 0.5 - Math.random());

            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                if (currentMode === 'ru-he') {
                    btn.setAttribute('dir', 'rtl');
                } else {
                    btn.setAttribute('dir', 'ltr');
                }
                btn.className = "py-4 px-3 bg-gray-100 hover:bg-blue-50 hover:text-blue-600 font-bold rounded-2xl text-base transition border-2 border-transparent cursor-pointer shadow-xs text-center relative overflow-visible";
                btn.onclick = () => checkAnswer(btn, opt, correctAns);
                optionsContainer.appendChild(btn);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            
            setTimeout(() => {
                timerBar.style.transition = 'width 1s linear';
            }, 50);

            timerInterval = setInterval(() => {
                timeLeft--;
                let percent = (timeLeft / 15) * 100;
                timerBar.style.width = percent + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;
            
            // Время вышло — считаем ошибкой и отправляем в конец очереди
            mistakeQueue.push(sessionQueue[currentIndex]);

            const currentPair = sessionQueue[currentIndex];
            const correctAns = (currentMode === 'he-ru') ? currentPair.ru : currentPair.he;

            for (let btn of optionsContainer.children) {
                if (btn.textContent === correctAns) {
                    btn.classList.remove('bg-gray-100');
                    btn.classList.add('bg-emerald-500', 'text-white');
                }
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500);
        }

        function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            const buttons = optionsContainer.children;

            if (selectedOpt === correctOpt) {
                selectedBtn.classList.remove('bg-gray-100');
                selectedBtn.classList.add('bg-emerald-500', 'text-white');
                score += 10;
                createFireworks(selectedBtn);
            } else {
                selectedBtn.classList.remove('bg-gray-100');
                selectedBtn.classList.add('bg-rose-500', 'text-white');

                // Ошибка — сохраняем слово для повтора в конце
                mistakeQueue.push(sessionQueue[currentIndex]);

                for (let btn of buttons) {
                    if (btn.textContent === correctOpt) {
                        btn.classList.remove('bg-gray-100');
                        btn.classList.add('bg-emerald-500', 'text-white');
                    }
                }
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1400);
        }

        function createFireworks(button) {
            const rect = button.getBoundingClientRect();
            const containerRect = optionsContainer.getBoundingClientRect();
            
            const x = rect.left - containerRect.left + rect.width / 2;
            const y = rect.top - containerRect.top + rect.height / 2;

            const emojis = ["⭐", "✨", "🌟", "💫", "🎉"];

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                optionsContainer.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScoreText.textContent = `Твой результат: ${score} очков`;
            resultEmoji.textContent = "👑";
        }

        function backToMenu() {
            clearInterval(timerInterval);
            gameScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
